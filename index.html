<!DOCTYPE html>
<html lang="id">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday dita💖</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

/* BACKGROUND FOTO */
.bg {
    position: absolute;
    width: 100%;
    height: 100%;
    background: url("foto.jpg") center/cover no-repeat;
    filter: blur(8px) brightness(0.5);
    z-index: -1;
}

/* CARD */

.card {
    width: 90%;
    max-width: 350px;
    text-align: center;
    padding: 25px;
    border-radius: 25px;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(12px);
    box-shadow: 0 0 40px rgba(0,0,0,0.7);
    animation: fadeIn 1.5s ease;

    display: flex;          /* tambah ini */
    flex-direction: column; /* biar vertikal rapi */
    align-items: center;    /* center horizontal isi */
}



/* FOTO UTAMA */
.profile {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid white;
    margin-bottom: 15px;
}
/* Slideshow */

.slideshow{
    position:relative;
    width:220px;
    height:220px;
    margin:auto;
    margin-bottom:20px;
}

.slide{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:20px;
    opacity:0;
    transition:1s;
    border:4px solid white;
    box-shadow:0 0 20px rgba(255,255,255,0.4);
}

.slide.active{
    opacity:1;
}

h1{
    font-size:2.2rem;
    line-height:1.1;
}

h2{
    font-size:1.5rem;
    margin-top:10px;
    color:#ffd54a;
}

p{
    margin-top:20px;
    font-size:1rem;
    line-height:1.5;
}
.btn {
    margin-top: 20px;
    padding: 10px 20px;
    border: none;
    border-radius: 25px;
    background: #ff416c;
    color: white;
    cursor: pointer;
}

.btn:hover {
    transform: scale(1.1);
    background: #ff4b2b;
}
/* RESPONSIVE HP */

@media(max-width:480px){

.card{
    width:92%;
    padding:20px;
}

h1{
    font-size:1.8rem;
}

h2{
    font-size:1.3rem;
}

p{
    font-size:0.95rem;
}

.slideshow{
    width:180px;
    height:180px;
}

}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(30px);}
    to {opacity: 1; transform: translateY(0);}
}
</style>
</head>

<body>

    <div class="bg"></div>
    
    <div class="card">
    
        <div class="slideshow">
            <img src="foto1.jpg" class="slide active">
            <img src="foto2.jpg" class="slide">
            <img src="foto3.jpg" class="slide">
        </div>
    
        <h1>🎉 Happy Birthday 🎂</h1>
        <h2>Alya radita az zahra💖</h2>
    
        <p>
            Semoga hari kamu selalu penuh bahagia ✨<br>
            Tetap jadi orang spesial di hidupku yah 💕<br>
            cie udah legal aja niee maaf klo cuma sesimple ini ngasihnya
        </p>
    
        <button class="btn" onclick="playMusic()">Buka Surprise 🎁</button>
    
    </div>
    
    <audio id="music" loop>
        <source src="lagu.mp3" type="audio/mp3">
    </audio>
    
    </body>

<script>
function playMusic() {
    document.getElementById("music").play();
    alert("Selamat ulang tahun 🎉💖");
}
/* AUTO SLIDESHOW */

let slides = document.querySelectorAll(".slide");

let index = 0;

setInterval(() => {

    slides[index].classList.remove("active");

    index = (index + 1) % slides.length;

    slides[index].classList.add("active");

},3000);
</script>

</body>
</html>
